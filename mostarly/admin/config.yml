# Decap CMS configuration: https://decapcms.org/docs/configuration-options/
# Before launch: set repo/branch to the site's repository and base_url to the GitHub OAuth proxy
# (on Cloudflare, a small Worker such as "decap-proxy" or "sveltia-cms-auth"). See README.
backend:
  name: github
  repo: grabator/old-bridge-mostar
  branch: mostarly-nacrt
  base_url: https://YOUR-OAUTH-PROXY.workers.dev
  commit_messages:
    update: "Admin: {{collection}} {{slug}}"
    create: "Admin: new {{collection}} {{slug}}"

media_folder: mostarly/src/img
public_folder: /img
site_url: https://mostarlyguide.com
locale: en

collections:
  - name: tours
    label: Tours
    label_singular: Tour
    folder: mostarly/content/tours
    extension: json
    format: json
    create: true
    identifier_field: slug
    slug: "{{slug}}"
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: slug, label: "Web address (tours/...)", widget: string, hint: "Lowercase words joined with dashes, e.g. mostar-old-town-highlights" }
      - { name: name, label: "Tour name", widget: string }
      - { name: tagline, label: "Short explanation (1–2 sentences)", widget: text }
      - name: category
        label: Category
        widget: select
        options:
          - { label: "Mostar city tours", value: city }
          - { label: "Food and culture", value: food }
          - { label: "Herzegovina day trips", value: daytrip }
          - { label: "Local experiences", value: experience }
      - { name: order, label: "Order in lists", widget: number, value_type: int }
      - { name: featured, label: "Show on the home page", widget: boolean, default: false }
      - { name: image, label: "Main photo", widget: image, required: false, choose_url: false }
      - { name: imageAlt, label: "Photo description (for blind visitors and Google)", widget: string, required: false }
      - name: price
        label: Price
        widget: object
        fields:
          - name: basis
            label: "Price type"
            widget: select
            options:
              - { label: "Per person", value: person }
              - { label: "Per group", value: group }
              - { label: "Price on request", value: request }
          - { name: amount, label: "Amount in €", widget: number, value_type: int, required: false }
          - { name: from, label: "Show as “from €…”", widget: boolean, default: false }
          - { name: confirmed, label: "Price confirmed (show on the live site)", widget: boolean, default: false }
      - { name: duration, label: Duration, widget: string }
      - { name: location, label: Location, widget: string }
      - { name: groupSize, label: "Group size", widget: string }
      - { name: level, label: "Walking level", widget: string }
      - { name: languages, label: Languages, widget: string }
      - { name: meetingPoint, label: "Meeting point", widget: string }
      - { name: availability, label: Availability, widget: string }
      - { name: description, label: "Website description", widget: text }
      - name: itinerary
        label: "What guests do (in order)"
        widget: list
        fields:
          - { name: text, label: Step, widget: string }
          - { name: optional, label: "Optional / seasonal stop", widget: boolean, default: false }
      - { name: included, label: Included, widget: list, field: { name: item, label: Item, widget: string } }
      - { name: notIncluded, label: "Not included / paid separately", widget: list, field: { name: item, label: Item, widget: string } }
      - { name: practical, label: "Good to know", widget: list, field: { name: item, label: Item, widget: string } }
      - name: tickets
        label: "Optional entrance tickets offered in the form"
        widget: select
        multiple: true
        required: false
        options:
          - { label: "Koski Mehmed Pasha Mosque", value: koski }
          - { label: "Dervish Tekke, Blagaj", value: tekke }
          - { label: "Bosnaseum museum", value: bosnaseum }
          - { label: "Kajtaz House", value: kajtaz }
          - { label: "Boat tour", value: boat }
          - { label: "Kravice Waterfalls", value: kravice }
      - { name: notes, label: "Draft notes (only visible in draft mode)", widget: list, required: false, field: { name: note, label: Note, widget: string } }
      - { name: seoTitle, label: "Google title", widget: string }
      - { name: seoDescription, label: "Google description", widget: text }

  - name: settings
    label: "Site settings"
    files:
      - name: site
        label: "Contact, tickets, FAQ and texts"
        file: mostarly/content/site.json
        format: json
        fields:
          - { name: draft, label: "Draft mode (shows yellow notes, hides site from Google)", widget: boolean }
          - { name: name, label: "Site name", widget: string }
          - { name: url, label: "Website address", widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: description, label: "Google description", widget: text }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: phone, label: Phone, widget: string }
              - { name: whatsapp, label: "WhatsApp number (digits only, with 387)", widget: string }
              - { name: email, label: Email, widget: string }
              - { name: instagram, label: "Instagram username", widget: string }
              - { name: tripadvisor, label: "Tripadvisor link", widget: string }
              - { name: meetingPoint, label: "Main meeting point", widget: string }
              - { name: mapUrl, label: "Map link", widget: string }
          - name: analytics
            label: Analytics
            widget: object
            fields:
              - { name: ga4, label: "Google Analytics 4 ID (G-...)", widget: string, required: false }
          - name: tickets
            label: "Entrance tickets"
            widget: list
            fields:
              - { name: id, label: "Code", widget: string }
              - { name: label, label: Name, widget: string }
              - { name: price, label: "Price per person (€)", widget: number, value_type: int }
          - { name: ticketsNote, label: "Note under tickets", widget: string }
          - name: reviews
            label: Reviews
            widget: object
            fields:
              - name: items
                label: "Verified reviews"
                widget: list
                required: false
                fields:
                  - { name: name, label: "Guest name", widget: string }
                  - { name: country, label: Country, widget: string, required: false }
                  - { name: date, label: "Month and year", widget: string, required: false }
                  - { name: source, label: "Source (Tripadvisor, Google)", widget: string, default: Tripadvisor }
                  - { name: text, label: "Review text (unedited)", widget: text }
              - { name: note, label: "Draft note", widget: string, required: false }
          - name: faq
            label: "FAQ"
            widget: list
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text }
              - { name: note, label: "Draft note", widget: string, required: false }
          - name: about
            label: "About Mirna"
            widget: object
            fields:
              - { name: short, label: "One-line introduction", widget: string }
              - { name: paragraphs, label: "Story paragraphs", widget: list, field: { name: p, label: Paragraph, widget: text } }
              - { name: experience, label: "Experience line", widget: string }
              - { name: notes, label: "Draft notes", widget: list, required: false, field: { name: n, label: Note, widget: string } }
          - name: why
            label: "Why book with a local guide"
            widget: list
            fields:
              - { name: t, label: Title, widget: string }
              - { name: d, label: Text, widget: text }
          - name: categories
            label: "Tour categories"
            widget: list
            fields:
              - { name: id, label: "Code (do not change)", widget: string }
              - { name: name, label: Name, widget: string }
              - { name: intro, label: Introduction, widget: text }
          - { name: onRequest, label: "More tours on request (names)", widget: list, field: { name: n, label: Name, widget: string } }
          - name: services
            label: "Services for travel professionals"
            widget: list
            fields:
              - { name: t, label: Title, widget: string }
              - { name: d, label: Text, widget: text }
          - name: languages
            label: "Languages"
            widget: object
            fields:
              - { name: live, label: "Live", widget: list, field: { name: l, label: Code, widget: string } }
              - { name: planned, label: "Planned", widget: list, field: { name: l, label: Code, widget: string } }
